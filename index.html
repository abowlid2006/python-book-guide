<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">دليل تعلم بايثون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --code-bg: #090d16;
        }

        /* Themes */
        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #e2e8f0;
            --accent-blue: #0284c7;
            --accent-green: #16a34a;
            --accent-yellow: #ca8a04;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --code-bg: #1e293b;
        }

        body.theme-black {
            --bg-primary: #000000;
            --bg-secondary: #121212;
            --bg-card: #1e1e1e;
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --border-color: #333333;
            --code-bg: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Styles */
        aside {
            width: 320px;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            right: 0;
            top: 0;
            z-index: 100;
        }

        body[dir="ltr"] aside {
            right: auto;
            left: 0;
            border-left: none;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .control-btn:hover {
            border-color: var(--accent-blue);
        }

        .search-box {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .nav-chapters {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .nav-chapter-item {
            display: block;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .nav-chapter-item:hover, .nav-chapter-item.active {
            background-color: var(--bg-card);
            color: var(--accent-blue);
            font-weight: 600;
        }

        .nav-chapter-item .ch-num {
            display: inline-block;
            width: 22px;
            height: 22px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        body[dir="ltr"] .nav-chapter-item .ch-num {
            margin-left: 0;
            margin-right: 6px;
        }

        /* Main Content */
        main {
            margin-right: 320px;
            flex: 1;
            padding: 30px;
            max-width: 1000px;
        }

        body[dir="ltr"] main {
            margin-right: 0;
            margin-left: 320px;
        }

        header.hero {
            background-color: var(--bg-secondary);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Chapter Cards */
        .chapter-card {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 25px;
            margin-bottom: 25px;
            scroll-margin-top: 20px;
        }

        .chapter-title {
            font-size: 1.3rem;
            color: var(--accent-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .chapter-title .tag {
            font-size: 0.75rem;
            background-color: rgba(56, 189, 248, 0.15);
            padding: 3px 8px;
            border-radius: 15px;
            color: var(--accent-blue);
        }

        .chapter-content {
            color: var(--text-main);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .chapter-content h4 {
            color: var(--accent-green);
            margin: 15px 0 8px 0;
            font-size: 1rem;
        }

        .chapter-content ul {
            margin: 0 20px 10px 0;
        }

        body[dir="ltr"] .chapter-content ul {
            margin: 0 0 10px 20px;
        }

        .chapter-content li {
            margin-bottom: 6px;
        }

        /* Interactive Code Block */
        .code-block {
            background-color: var(--code-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 15px 0;
            overflow: hidden;
        }

        .code-header {
            background-color: var(--bg-secondary);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .code-header .lang {
            font-family: 'Fira Code', monospace;
            color: var(--accent-yellow);
        }

        .run-btn {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        pre code {
            display: block;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #e2e8f0;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
        }

        .code-output {
            background-color: #030712;
            padding: 10px 12px;
            border-top: 1px dashed var(--border-color);
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--accent-green);
            direction: ltr;
            text-align: left;
            display: none;
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: var(--accent-blue);
            color: #0f172a;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 200;
        }

        @media (max-width: 900px) {
            aside {
                transform: translateX(100%);
                transition: transform 0.3s;
            }
            body[dir="ltr"] aside {
                transform: translateX(-100%);
            }
            aside.open {
                transform: translateX(0);
            }
            main {
                margin-right: 0 !important;
                margin-left: 0 !important;
                padding: 15px;
            }
            .mobile-toggle {
                display: block;
            }
        }
    </style>
</head>

        let currentLang = 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('htmlRoot').setAttribute('dir', lang === 'ku' ? 'ltr' : 'rtl');
            document.getElementById('htmlRoot').setAttribute('lang', lang);
            
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('sidebarTitle').innerText = t.sidebarTitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('heroTitle').innerText = t.heroTitle;
            document.getElementById('heroDesc').innerText = t.heroDesc;

            renderNav();
            renderChapters(t.chapters);
        }

        function setTheme(themeClass) {
            document.body.className = themeClass;
        }

        function renderNav() {
            const t = translations[currentLang];
            const nav = document.getElementById('chaptersNav');
            nav.innerHTML = t.chapters.map(ch => `
                <a class="nav-chapter-item" onclick="scrollToChapter(${ch.id})">
                    <span class="ch-num">${ch.id}</span>
                    ${ch.title}
                </a>
            `).join('');
        }

        function renderChapters(chaptersList) {
            const t = translations[currentLang];
            const container = document.getElementById('chaptersContainer');
            
            container.innerHTML = chaptersList.map(ch => `
                <div class="chapter-card" id="chapter-${ch.id}">
                    <div class="chapter-title">
                        <span>${currentLang === 'ku' ? 'بەشا ' + ch.id + ': ' + ch.title : 'الفصل ' + ch.id + ': ' + ch.title}</span>
                        <span class="tag">${ch.tag}</span>
                    </div>
                    <div class="chapter-content">
                        <p style="margin-bottom: 12px; font-weight: 600; color: var(--accent-blue);">${ch.summary}</p>
                        ${ch.details}
                        ${ch.code ? `
                            <div class="code-block">
                                <div class="code-header">
                                    <span class="lang">Python 3</span>
                                    <button class="run-btn" onclick="runCode(${ch.id})">${t.runCodeText}</button>
                                </div>
                                <pre><code>${escapeHtml(ch.code)}</code></pre>
                                <div class="code-output" id="output-${ch.id}">${ch.output}</div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function runCode(id) {
            const outputEl = document.getElementById(`output-${id}`);
            if (outputEl) outputEl.style.display = 'block';
        }

        function scrollToChapter(id) {
            const el = document.getElementById(`chapter-${id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
                if (window.innerWidth <= 900) toggleSidebar();
            }
        }

        function filterChapters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const t = translations[currentLang];
            const filtered = t.chapters.filter(ch => 
                ch.title.toLowerCase().includes(query) || 
                ch.summary.toLowerCase().includes(query)
            );
            renderChapters(filtered);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Initialize Default
        setLanguage('ar');
    </script>
